<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio WEBSITE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(0, 0, 33);
            color: white;
            font-family: 'Poppins', sans-serif;

        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 80px;
            background-color: rgb(18, 18, 62);
        }

        nav ul {
            display: flex;
            justify-content: center;
        }

        nav ul li {
            list-style: none;
            margin: 0 23px;
        }
        nav ul li a{
            text-decoration: none;
            color: white;
        }
        nav ul li a:hover{
            color: rgb(141, 141, 223);
            font-size: 1.05rem;
        }
        main hr{
            border: 0;
            background: #9c97f1;
            height: 1.2px;
            margin: 40px 84px;
        }


        .left {
            font-size: 1.5rem;
        }

        .firstsection {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 130px 0;
        }

        .firstsection>div {
            width: 40%;
        }
        .image-top{
            margin: 250px 1500px;
            width: 220px;
            height:250px;
            display: flex;
            justify-content: center;
            border-radius: 70%;
            border:10px

        }

        .leftsection {
            font-size: 3rem;

        }

        .rightsection img {
            width: 80%;

        }

        .purple {
            color: rgb(170,107,228);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="left">JN.</div>
            <div class="right">
                <ul>
                   <li><a href="/">Home</a></li>
                   <li><a href="/">About</a></li>
                   <li><a href="/">Projects</a></li>
                   <li><a href="/">Contact me</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section class="firstsection">
            <div class="leftsection">Hey there! I'm <span class="purple">Jatin Nayak</span>
                <div>A Creative Front-End Developer &</div> <span id="element"></span>

            </div>
           <div class="rightsection">
                <img src="bg.png" alt="">
           </div>


        </section>
        <img src="boy.jpg" alt="" class="image-top">
        <hr>
    </main>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <!-- Setup and start animation! -->
    <script>
      var typed = new Typed('#element', {
        strings: [' C++ Enthusiast', 'Cinemetographer','photographer','Video Editor'],
        typeSpeed: 50,
      });
    </script>
</body>

</html>
